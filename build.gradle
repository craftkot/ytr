plugins {
    id 'net.fabricmc.fabric-loom' version "${loom_version}"
}

version = project.mod_version
group = project.maven_group

base {
    archivesName = project.archives_base_name
}

repositories {
    mavenCentral()
}

dependencies {
    minecraft "com.mojang:minecraft:${project.minecraft_version}"
    implementation "net.fabricmc:fabric-loader:${project.loader_version}"
    implementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_api_version}"

    testImplementation "org.junit.jupiter:junit-jupiter:5.12.2"
    testRuntimeOnly "org.junit.platform:junit-platform-launcher"
}

def modVersionForResources = project.version.toString()
tasks.named('processResources').configure {
    inputs.property 'version', modVersionForResources
    filesMatching('fabric.mod.json') {
        expand 'version': modVersionForResources
    }
}

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(25)
    }
    withSourcesJar()
}

tasks.withType(JavaCompile).configureEach {
    options.release = 25
    options.encoding = 'UTF-8'
}

tasks.withType(Test).configureEach {
    useJUnitPlatform()
}

jar {
    from('LICENSE') {
        rename { "${it}_${project.base.archivesName.get()}" }
    }
}

// Diagnostic inventory from the exact Minecraft classes used to compile
// this branch, not from unrelated mappings or a guessed renderer version.
tasks.register('dumpTerrainRendererApi') {
    def output = layout.buildDirectory.file('terrain-renderer-api.txt')
    outputs.file(output)
    doLast {
        def target = output.get().asFile
        target.parentFile.mkdirs()
        def process = new ProcessBuilder(
                new File(System.getProperty('java.home'), 'bin/javap').absolutePath,
                '-p', '-c', '-classpath', sourceSets.main.compileClasspath.asPath,
                'net.minecraft.client.renderer.LevelRenderer',
                'net.minecraft.client.renderer.chunk.ChunkSectionsToRender',
                'net.minecraft.client.renderer.chunk.ChunkSectionLayerGroup',
                'com.mojang.renderpearl.api.commands.RenderPass')
                .redirectErrorStream(true).redirectOutput(target).start()
        if (process.waitFor() != 0)
            throw new GradleException('Renderer API inspection failed: ' + target.text)
        logger.lifecycle('Exact renderer bytecode inventory: ' + target)
    }
}

// Inspect target-version worldgen bytecode before binding seed-specific adapters.
tasks.register('dumpWorldgenApi') {
    def output = layout.buildDirectory.file('worldgen-api.txt')
    outputs.file(output)
    inputs.files(sourceSets.main.compileClasspath)
    doLast {
        def target = output.get().asFile
        target.parentFile.mkdirs()
        def process = new ProcessBuilder(
                new File(System.getProperty('java.home'), 'bin/javap').absolutePath,
                '-p', '-c', '-classpath', sourceSets.main.compileClasspath.asPath,
                'net.minecraft.world.level.levelgen.RandomState',
                'net.minecraft.world.level.levelgen.NoiseBasedChunkGenerator',
                'net.minecraft.world.level.chunk.ChunkGenerator',
                'net.minecraft.server.level.ServerLevel',
                'net.minecraft.server.level.ServerChunkCache',
                'net.minecraft.server.level.ChunkMap')
                .redirectErrorStream(true).redirectOutput(target).start()
        if (process.waitFor() != 0)
            throw new GradleException('Worldgen API inspection failed: ' + target.text)
    }
}
