name: Build and test

on:
  push:
    branches: [ operator-dev, 'feature/real-client-game-smoke' ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Java 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.8.2'
      - name: Run tests and build mod
        run: gradle clean test build --no-daemon
      - name: Smoke-test dedicated server startup and commands
        shell: bash
        run: |
          mkdir -p run
          printf 'eula=true\n' > run/eula.txt
          cat > run/server.properties <<'PROPERTIES'
          enable-rcon=true
          rcon.port=25575
          rcon.password=operator-ci-smoke-password
          online-mode=false
          server-port=25565
          PROPERTIES
          gradle runServer --no-daemon > run-server-console.log 2>&1 &
          gradle_pid=$!
          set +e
          python3 - <<'PY'
          import socket
          import struct
          import time
          import sys

          HOST = "127.0.0.1"
          PORT = 25575
          PASSWORD = "operator-ci-smoke-password"

          def read_exact(sock, length):
              data = b""
              while len(data) < length:
                  chunk = sock.recv(length - len(data))
                  if not chunk:
                      raise ConnectionError("RCON connection closed")
                  data += chunk
              return data

          def read_packet(sock):
              length = struct.unpack("<i", read_exact(sock, 4))[0]
              packet = read_exact(sock, length)
              request_id, packet_type = struct.unpack("<ii", packet[:8])
              return request_id, packet_type, packet[8:-2].decode("utf-8", errors="replace")

          def send_packet(sock, request_id, packet_type, payload):
              body = struct.pack("<ii", request_id, packet_type) + payload.encode("utf-8") + b"\0\0"
              sock.sendall(struct.pack("<i", len(body)) + body)

          last_error = None
          for attempt in range(150):
              try:
                  with socket.create_connection((HOST, PORT), timeout=3) as sock:
                      sock.settimeout(5)
                      send_packet(sock, 1, 3, PASSWORD)
                      auth_id, _, _ = read_packet(sock)
                      if auth_id != 1:
                          raise RuntimeError("RCON authentication failed")
                      send_packet(sock, 2, 2, "operator status")
                      command_id, _, output = read_packet(sock)
                      if command_id != 2:
                          raise RuntimeError("RCON status command did not return a response")
                      if "PASSIVE OBSERVATION" not in output:
                          raise RuntimeError("Unexpected Operator status response: " + output)
                      print("RCON status command passed: " + output)
                      send_packet(sock, 3, 2, "stop")
                      print("RCON stop command sent.")
                  break
              except Exception as exc:
                  last_error = exc
                  time.sleep(1)
          else:
              print("Could not complete RCON smoke test: " + str(last_error), file=sys.stderr)
              sys.exit(1)
          PY
          smoke_result=$?
          set -e
          if [ "$smoke_result" -ne 0 ]; then
            kill "$gradle_pid" 2>/dev/null || true
            wait "$gradle_pid" 2>/dev/null || true
            cat run-server-console.log
            exit "$smoke_result"
          fi
          wait "$gradle_pid"
          if [ ! -f run/logs/latest.log ] || ! grep -q "Done (" run/logs/latest.log; then
            echo "Minecraft server did not reach the ready state."
            cat run-server-console.log
            find run -maxdepth 4 -type f -name '*.log' -print
            exit 1
          fi
          if ! grep -q "schemaVersion.*9" run/world/operator_reality/operator-memory.json; then
            echo "Operator world memory was not persisted."
            exit 1
          fi
          echo "Dedicated server started, Operator loaded, status command passed, and world memory persisted."
      - name: Integration-test real block apply and rollback across restarts
        shell: bash
        run: python3 tools/integration_relocation_smoke.py
      - name: Test crash recovery
        run: python3 tools/integration_unclean_crash_smoke.py
      - name: Real autonomous tunnel fold world integration
        run: python3 tools/integration_autonomous_tunnel_smoke.py
      - name: Run actual graphical Fabric Minecraft client
        shell: bash
        env:
          DISPLAY: :99
          LIBGL_ALWAYS_SOFTWARE: "1"
          MESA_LOADER_DRIVER_OVERRIDE: llvmpipe
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y xvfb xdotool scrot mesa-utils libgl1-mesa-dri \
            libx11-6 libxext6 libxrender1 libxtst6 libxi6 libxrandr2 \
            libxcursor1 libxinerama1 libxxf86vm1
          python3 -m pip install --quiet Pillow
          Xvfb :99 -screen 0 1280x720x24 -ac +extension GLX +render -noreset > xvfb.log 2>&1 &
          sleep 3
          glxinfo -B
          python3 tools/integration_real_client_smoke.py
      - name: Upload real client screenshots and logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: operator-real-minecraft-client-screenshots
          if-no-files-found: ignore
          path: |
            client-smoke-artifacts/**
            client-console.log
            run/logs/latest.log
            xvfb.log
      - name: Upload autonomous world-test logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: operator-tunnel-fold-live-world-logs
          if-no-files-found: ignore
          path: integration-tunnel-phase-*.log
      - name: Upload mod JARs
        uses: actions/upload-artifact@v4
        with:
          name: operator-reality-0.23.0
          path: build/libs/*.jar
          if-no-files-found: error
      - name: Package source snapshot
        run: |
          zip -qr operator-reality-0.23.0-source.zip \
            src build.gradle settings.gradle gradle.properties .gitignore \
            LICENSE README.md CHANGELOG.md BUILD_STATUS.txt tools .github/workflows/build.yml
      - name: Upload source snapshot
        uses: actions/upload-artifact@v4
        with:
          name: operator-reality-0.23.0-source
          path: operator-reality-0.23.0-source.zip
          if-no-files-found: error
