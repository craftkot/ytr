name: Worldgen API inspection
on:
  push:
    branches: [feature/seeded-regeneration-research]
  pull_request:
    branches: [integration/chaos-world]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.8.2'
      - run: gradle dumpWorldgenApi test --no-daemon
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: worldgen-api
          path: |
            build/worldgen-api.txt
            build/test-results/test/
