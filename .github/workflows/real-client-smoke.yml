name: Operator Reality - Real Minecraft Client

on:
  push:
    branches: [ operator-dev, feature/seamless-world-field ]
    paths:
      - 'src/**'
      - 'tools/seed_graphical_client_world.py'
      - 'tools/integration_real_client_smoke.py'
      - '.github/workflows/real-client-smoke.yml'
      - 'build.gradle'
      - 'gradle.properties'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: operator-reality-real-client-${{ github.ref }}
  cancel-in-progress: true

jobs:
  graphical-in-game:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Setup Java 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.8.2'
      - name: Compile and run JUnit
        run: gradle clean test build --no-daemon
      - name: Generate disposable Minecraft 26.3 singleplayer world
        run: python3 tools/seed_graphical_client_world.py
      - name: Launch actual game window and capture scene
        env:
          DISPLAY: ':99'
          LIBGL_ALWAYS_SOFTWARE: '1'
          MESA_LOADER_DRIVER_OVERRIDE: llvmpipe
        shell: bash
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y xvfb xdotool scrot mesa-utils \
            weston libwayland-egl1 mesa-vulkan-drivers libvulkan1 vulkan-tools \
            libgl1-mesa-dri libx11-6 libxext6 libxrender1 \
            libxtst6 libxi6 libxrandr2 libxcursor1 libxinerama1 libxxf86vm1
          python3 -m pip install --quiet Pillow
          export XDG_RUNTIME_DIR="$RUNNER_TEMP/operator-wayland"
          mkdir -p "$XDG_RUNTIME_DIR"
          chmod 700 "$XDG_RUNTIME_DIR"
          Xvfb :99 -screen 0 1280x720x24 -ac +extension GLX +render -noreset > xvfb.log 2>&1 &
          sleep 3
          glxinfo -B
          echo "Starting Weston nested X11 compositor; Minecraft SDL3 uses native Wayland"
          weston --backend=x11-backend.so --renderer=gl --shell=kiosk \
            --socket=wayland-1 --width=1280 --height=720 --log=weston.log > weston-console.log 2>&1 &
          sleep 5
          if [ ! -S "$XDG_RUNTIME_DIR/wayland-1" ]; then
            echo 'Weston nested Wayland socket missing'
            cat weston.log weston-console.log
            exit 1
          fi
          export WAYLAND_DISPLAY=wayland-1
          export SDL_VIDEO_DRIVER=wayland
          export XDG_SESSION_TYPE=wayland
          export EGL_PLATFORM=wayland
          python3 tools/integration_real_client_smoke.py
      - name: Upload three in-game screenshots and console logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: operator-real-minecraft-client-screenshots
          if-no-files-found: ignore
          path: |
            client-smoke-artifacts/**
            client-console.log
            client-seed-server.log
            run/logs/latest.log
            xvfb.log
            weston.log
            weston-console.log
